[package]
name = "wiki-context-desktop"
version = "0.5.6"
description = "wiki-context Cross-Platform Control Center & Knowledge Gateway"
authors = ["wiki-context contributors"]
edition = "2021"

[lib]
name = "wiki_context_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Required so production builds embed frontendDist via custom protocol instead of devUrl
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
rand = "0.8"
